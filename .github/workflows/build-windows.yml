
name: Build Windows EXE

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install psutil pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BatteryPredictor battery_predictor_gui.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BatteryPredictor-Windows
          path: dist/BatteryPredictor.exe

